name: Release

# Publishing a release: tag a commit with `v<versionName>` (e.g. `v1.1`) and
# push the tag. This workflow builds the APK and publishes a GitHub Release
# with the changelog (commits since the previous tag) and the
# `parrot-karaoke.apk` asset.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android/setup-android@v3

      - name: Build APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/parrot-karaoke.apk
          ls -l dist/

      - name: Generate changelog
        run: |
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$LATEST" ]; then
            git log "${LATEST}..HEAD" --reverse --pretty='- %s' > CHANGELOG.md
          else
            git log --reverse --pretty='- %s' > CHANGELOG.md
          fi
          echo '--- changelog ---'
          cat CHANGELOG.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: dist/parrot-karaoke.apk
          fail_on_unmatched_files: true
