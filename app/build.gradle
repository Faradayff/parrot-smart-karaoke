plugins {
    id 'com.android.application'
}

// Optional local dev defaults (relay URL + Basic Auth) baked into this
// machine's builds only. The file is gitignored and never uploaded: the
// public releases built in CI ship with empty defaults (no relay in the
// binary at all). See `local-dev.properties.example`.
def devPropsFile = file('local-dev.properties')
def devProps = new Properties()
if (devPropsFile.canRead()) {
    devPropsFile.withInputStream { devProps.load(it) }
}
def devUrl  = devProps.getProperty('relay.url', '')
def devUser = devProps.getProperty('relay.user', '')
def devPass = devProps.getProperty('relay.pass', '')
def debugHttpLog = devProps.getProperty('debug.http_log', 'false') == 'true'

android {
    namespace 'me.farnasx.parrotkaraoke'
    compileSdk 34

    defaultConfig {
        applicationId "me.farnasx.parrotkaraoke"
        minSdk 10
        targetSdk 10
        versionCode 5
        versionName "1.4"

        // Defaults for the settings screen: empty in public builds,
        // preconfigured in local development builds.
        buildConfigField "String", "DEFAULT_RELAY_URL", "\"${devUrl}\""
        buildConfigField "String", "DEFAULT_RELAY_USER", "\"${devUser}\""
        buildConfigField "String", "DEFAULT_RELAY_PASS", "\"${devPass}\""
        // Development builds append each attempt (incl. the exact
        // Authorization value sent) to /sdcard/parrot-karaoke-debug.log.
        buildConfigField "boolean", "DEBUG_HTTP_LOG", "${debugHttpLog ? 'true' : 'false'}"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        // The code reads BuildConfig (relay defaults) — disabled by default in AGP 8.
        buildConfig true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Test-only stubs for org.json (on-device the class comes from Android itself);
    // the app has zero runtime dependencies.
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
